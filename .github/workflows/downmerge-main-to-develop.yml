name: Downmerge Main to Develop

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  downmerge:
    name: Downmerge Main to Develop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Evaluate downmerge necessity
        id: eval_downmerge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          echo "Commit Author: $COMMIT_AUTHOR"
          echo "Commit Message: $COMMIT_MSG"

          # 1. Skip if automated commit or explicit skip marker present
          if [[ "$COMMIT_MSG" == *"[skip downmerge]"* ]] || \
             [[ "$COMMIT_MSG" == *"[skip ci]"* ]] || \
             [[ "$COMMIT_MSG" =~ ^chore\(release\) ]] || \
             [[ "$COMMIT_MSG" =~ ^chore\(sync\) ]] || \
             [[ "$COMMIT_AUTHOR" == *"bot"* ]] || \
             [[ "$COMMIT_AUTHOR" == "github-actions" ]]; then
            echo "Skipping: Automation marker or bot author detected."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. Skip if the commit on main is a merge of develop into main
          # (develop is the source of this merge, so develop already has all changes)
          if [[ "$COMMIT_MSG" =~ "from "[^/]*"/develop" ]] || \
             [[ "$COMMIT_MSG" =~ "Merge branch 'develop'" ]]; then
            echo "Skipping: Commit on main is a merge from develop."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Fetch latest origin/develop to compare
          git fetch origin develop

          # 3. Skip if the tree of main and develop is already identical
          if git diff --quiet origin/develop origin/main; then
            echo "Skipping: develop and main file trees are 100% identical."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 4. Check for actual non-merge commits on main missing from develop
          # (e.g. hotfixes committed or merged directly into main)
          NON_MERGE_COUNT=$(git rev-list --no-merges --count origin/develop..origin/main)
          echo "Non-merge commits on main missing from develop: $NON_MERGE_COUNT"
          if [ "$NON_MERGE_COUNT" -eq 0 ]; then
            echo "Skipping: No non-merge commits on main missing from develop."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 5. Check if the only changed files are website version or documentation
          CHANGED_FILES=$(git diff --name-only origin/develop origin/main)
          echo "Changed files between develop and main:"
          echo "$CHANGED_FILES"

          # Filter out files that don't need code downmerging (website/, docs/, RELEASE_NOTES.md, .github/)
          CODE_CHANGES=$(echo "$CHANGED_FILES" | grep -vE "^(website/|docs/|RELEASE_NOTES\.md|\.github/)" || true)
          if [ -z "$CODE_CHANGES" ]; then
            echo "Skipping: Changes on main only affect website/docs/metadata, no code downmerge needed."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Downmerge is required for new code changes on main."
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: Check for existing downmerge PR
        if: steps.eval_downmerge.outputs.should_run == 'true'
        id: check_pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Existing open downmerge PR detected: #$EXISTING_PR"
            echo "has_open_pr=true" >> $GITHUB_OUTPUT
          else
            echo "has_open_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Downmerge PR (main -> develop)
        if: steps.eval_downmerge.outputs.should_run == 'true' && steps.check_pr.outputs.has_open_pr == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head main \
            --title "chore(sync): downmerge main into develop" \
            --body "Automated downmerge pull request: syncs hotfix code changes from \`main\` into \`develop\`."
