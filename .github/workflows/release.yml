name: Release Anahat

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libasound2-dev

      - name: Install dependencies & Build Frontend
        run: |
          npm ci
          npm run build

      - name: Configure Apple Signing (if secrets provided)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_ID: ${{ secrets.APPLE_ID }}
          APP_PASS: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERT" ]; then
            echo "APPLE_CERTIFICATE=${APPLE_CERT}" >> $GITHUB_ENV
            echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERT_PASS}" >> $GITHUB_ENV
            echo "APPLE_ID=${APP_ID}" >> $GITHUB_ENV
            echo "APPLE_PASSWORD=${APP_PASS}" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=${TEAM_ID}" >> $GITHUB_ENV
            echo "Apple signing credentials configured."
          else
            echo "No Apple Certificate secret detected. Skipping macOS code signing."
          fi

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Anahat ${{ github.ref_name }}'
          releaseBody: 'See changelog for release details.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
