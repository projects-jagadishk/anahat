name: Release Anahat

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-main-tag:
    name: Verify Release Tag is on Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Tag is on main branch
        shell: bash
        run: |
          git fetch origin main:main
          if git merge-base --is-ancestor HEAD main; then
            echo "Verification passed: Tag ${{ github.ref_name }} originates from the 'main' branch."
          else
            echo "::error::Release tags (v*) must be created on the 'main' branch. Current tag commit is not reachable from 'main'."
            exit 1
          fi

  release:
    needs: verify-main-tag
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libasound2-dev

      - name: Install dependencies & Build Frontend
        run: |
          npm ci
          npm run build

      - name: Configure Apple Signing (if secrets provided)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_ID: ${{ secrets.APPLE_ID }}
          APP_PASS: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERT" ]; then
            echo "APPLE_CERTIFICATE=${APPLE_CERT}" >> $GITHUB_ENV
            echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERT_PASS}" >> $GITHUB_ENV
            echo "APPLE_ID=${APP_ID}" >> $GITHUB_ENV
            echo "APPLE_PASSWORD=${APP_PASS}" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=${TEAM_ID}" >> $GITHUB_ENV
            echo "Apple signing credentials configured."
          else
            echo "No Apple Certificate secret detected. Skipping macOS code signing."
          fi

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD || '' }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Anahat ${{ github.ref_name }}'
          releaseBody: 'See changelog for release details.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Unversioned Latest Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "Scanning built bundles to upload unversioned permalinks..."

          # macOS Universal DMG
          for f in $(find src-tauri/target -name "*.dmg" -not -name "Anahat_universal.dmg" 2>/dev/null); do
            echo "Uploading unversioned macOS DMG: $f -> Anahat_universal.dmg"
            cp "$f" Anahat_universal.dmg
            gh release upload "${{ github.ref_name }}" Anahat_universal.dmg --clobber --repo "${{ github.repository }}"
            break
          done

          # Linux AppImage
          for f in $(find src-tauri/target -name "*.AppImage" -not -name "Anahat_amd64.AppImage" 2>/dev/null); do
            echo "Uploading unversioned Linux AppImage: $f -> Anahat_amd64.AppImage"
            cp "$f" Anahat_amd64.AppImage
            gh release upload "${{ github.ref_name }}" Anahat_amd64.AppImage --clobber --repo "${{ github.repository }}"
            break
          done

          # Linux DEB
          for f in $(find src-tauri/target -name "*.deb" -not -name "anahat_amd64.deb" 2>/dev/null); do
            echo "Uploading unversioned Linux DEB: $f -> anahat_amd64.deb"
            cp "$f" anahat_amd64.deb
            gh release upload "${{ github.ref_name }}" anahat_amd64.deb --clobber --repo "${{ github.repository }}"
            break
          done

          # Windows NSIS Setup (.exe)
          for f in $(find src-tauri/target -name "*setup.exe" -not -name "Anahat_x64-setup.exe" 2>/dev/null); do
            echo "Uploading unversioned Windows Setup: $f -> Anahat_x64-setup.exe"
            cp "$f" Anahat_x64-setup.exe
            gh release upload "${{ github.ref_name }}" Anahat_x64-setup.exe --clobber --repo "${{ github.repository }}"
            break
          done

          # Windows MSI Installer (.msi)
          for f in $(find src-tauri/target -name "*.msi" -not -name "Anahat_x64.msi" 2>/dev/null); do
            echo "Uploading unversioned Windows MSI: $f -> Anahat_x64.msi"
            cp "$f" Anahat_x64.msi
            gh release upload "${{ github.ref_name }}" Anahat_x64.msi --clobber --repo "${{ github.repository }}"
            break
          done

  update-website:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update website release version & links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          echo "Updating website references for release: $VERSION"

          # Update version strings in website/index.html
          sed -i -E "s/RELEASE BINARIES \/\/ v[0-9\.]+/RELEASE BINARIES \/\/ $VERSION/g" website/index.html
          sed -i -E "s/DOWNLOAD ANAHAT v[0-9\.]+/DOWNLOAD ANAHAT $VERSION/g" website/index.html

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/index.html
          if git diff --staged --quiet; then
            echo "Website index.html is already up to date."
          else
            git commit -m "chore(release): update website release version to $VERSION [skip ci]"
            # Attempt direct push to main; if ruleset blocks, create PR targeting main
            git push origin main || {
              echo "Direct push to main was blocked by ruleset. Creating PR to update main..."
              BRANCH="chore/update-website-${VERSION}"
              git checkout -b "$BRANCH"
              git push origin "$BRANCH"
              gh pr create \
                --base main \
                --head "$BRANCH" \
                --title "chore(release): update website version to $VERSION" \
                --body "Automated website version update for release $VERSION."
            }
          fi
