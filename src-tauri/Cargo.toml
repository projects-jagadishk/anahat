[package]
name = "anahat"
version = "1.0.0"
description = "Neuroacoustic Sound Deck & Visualizer"
authors = ["Anahat Team"]
edition = "2024"

[lib]
name = "anahat_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = "0.23.0"
hound = "3.5.1"
tauri-plugin-dialog = "2.8.4"
